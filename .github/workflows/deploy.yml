name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-supabase
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm exec supabase db push --db-url "${SUPABASE_DB_URL:?Set the SUPABASE_DB_URL repository secret}"

  deploy:
    needs: supabase
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-tanstack, frontend-remix]
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm -F "@remix-v3-demo/$APP" run deploy --var SUPABASE_URL:"$SUPABASE_URL" --var SUPABASE_PUBLISHABLE_KEY:"$SUPABASE_PUBLISHABLE_KEY"
