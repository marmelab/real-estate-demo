# Trimmed from https://github.com/supabase/supabase/tree/master/docker, dev-only secrets.
x-jwt-secret: &jwt-secret dev-only-jwt-secret-with-at-least-32-characters
x-anon-key: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE3NjEwMDQ4MDAsImV4cCI6NDEwMjQ0NDgwMH0.FYPcTXYajuBqtcspGlfMqwfLzDh4rjReoFRP5gDsCRM
x-service-key: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTc2MTAwNDgwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.b0Uh4oQIKAC-xKF480nYanawRtW6njDYVAEw64t_GPg
x-pg-meta-crypto-key: &pg-meta-crypto-key dev-only-pg-meta-crypto-key-32-chars

services:
  workspace:
    build: .
    command: sleep infinity
    volumes:
      - ..:/workspaces/remix-v3-demo:cached
    networks:
      default:
        # db shares this network, so other services reach Postgres through this alias.
        aliases: [db]

  # kong, studio and db share the workspace network on the Supabase CLI ports (54321 API, 54322 db, 54323 Studio),
  # so localhost reaches them from the workspace, its browsers and the forwarded host ports.
  kong:
    image: kong/kong:3.9.3
    network_mode: service:workspace
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./supabase/kong.yml:/home/kong/temp.yml:ro
      - ./supabase/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:54321
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_KEY: *service-key
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    network_mode: service:workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:54323/api/platform/profile'').then((r) => {if (r.status !== 200) throw new Error(r.status)})"',
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 54323
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 54322
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: *pg-meta-crypto-key
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: Default Organization
      DEFAULT_PROJECT_NAME: Default Project
      SUPABASE_URL: http://localhost:54321
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_KEY: *service-key
      AUTH_JWT_SECRET: *jwt-secret
      ENABLED_FEATURES_LOGS_ALL: "false"

  auth:
    image: supabase/gotrue:v2.197.0
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:54322/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**,http://localhost:4000/**
      GOTRUE_SMTP_HOST: maildev
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@keyhaven.localhost
      GOTRUE_SMTP_SENDER_NAME: Keyhaven
      GOTRUE_MAILER_SUBJECTS_INVITE: Invitation Keyhaven
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  maildev:
    image: maildev/maildev:2.2.1

  rest:
    image: postgrest/postgrest:v14.18
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:54322/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  storage:
    image: supabase/storage-api:v1.81.0
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status",
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-key
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: *jwt-secret
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:54322/postgres
      STORAGE_PUBLIC_URL: http://localhost:54321
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      # No imgproxy in dev.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  meta:
    image: supabase/postgres-meta:v0.100.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 54322
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
      CRYPTO_KEY: *pg-meta-crypto-key

  db:
    image: supabase/postgres:17.6.1.136
    network_mode: service:workspace
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 54322
      POSTGRES_PORT: 54322
      PGPASSWORD: postgres
      POSTGRES_PASSWORD: postgres
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
      ]
    volumes:
      # Creates supabase_functions_admin, which roles.sql needs.
      - ./supabase/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./supabase/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      # Persists the pgsodium decryption key.
      - db-config:/etc/postgresql-custom

  frontend-tanstack: &app
    image: node:26-trixie
    network_mode: service:workspace
    user: node
    restart: unless-stopped
    volumes_from: [workspace]
    working_dir: /workspaces/remix-v3-demo/packages/frontend-tanstack
    # production builds once then serves the build; development runs the reloading dev server.
    command:
      [
        "sh",
        "-c",
        'if [ "$$NODE_ENV" = production ]; then npm run build && npm start; else npm run dev; fi',
      ]
    environment: &app-env
      NODE_ENV: production
      SUPABASE_URL: http://localhost:54321
      SUPABASE_PUBLISHABLE_KEY: *anon-key
      SUPABASE_SERVICE_ROLE_KEY: *service-key

  frontend-remix:
    <<: *app
    working_dir: /workspaces/remix-v3-demo/packages/frontend-remix
    environment:
      <<: *app-env
      PORT: 4000

  caddy:
    image: caddy:2.10.2-alpine
    network_mode: service:workspace
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  db-data:
  db-config:
  storage-data:
